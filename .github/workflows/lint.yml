name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        # --locked FAILS if uv.lock is out of date with pyproject.toml instead of silently
        # regenerating it. Without it a stale lock never surfaces in CI -- every uv command
        # re-locks by default -- so the drift is invisible here and instead lands on whoever
        # next runs the pre-commit hook, as an unrelated uv.lock diff in their branch. That is
        # how the lifejacket 1.3.0 -> 2.0.0 bump went unlocked from de10751 until PR #79.
        run: uv sync --extra dev --locked

      - name: Lint (ruff check)
        run: uv run ruff check lifejacket/ tests/

      - name: Format check (ruff format)
        run: uv run ruff format --check lifejacket/ tests/
