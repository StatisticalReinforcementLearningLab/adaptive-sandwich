repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests
        # Resolve uv before calling it. `language: system` runs this with whatever PATH the git
        # client happens to export, and GUI clients (VS Code, JetBrains, Tower) do not source a
        # login shell -- so uv's default install location, ~/.local/bin, is missing and the hook
        # dies with "Executable `uv` not found" even though it works from a terminal.
        entry: bash -c 'command -v uv >/dev/null 2>&1 || export PATH="$HOME/.local/bin:$PATH"; exec uv run python -m pytest tests/unit_tests -m "not slow"'
        language: system
        types: [python]
        pass_filenames: false
