repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests
        entry: uv run python -m pytest tests/unit_tests -m "not slow"
        language: system
        types: [python]
        pass_filenames: false
