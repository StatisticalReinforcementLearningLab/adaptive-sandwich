[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifejacket"
version = "1.3.0"
description = "Consistent standard errors for longitudinal data collected under pooling online decision policies."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Nowell Closser", email = "nowellclosser@gmail.com"}
]
dependencies = [
    "click>=8.0,<9",
    "jax>=0.4.0,<0.5",
    "jaxlib>=0.4.0,<0.5",
    "numpy>=1.20.0,<2",
    "pandas>=1.3.0,<3",
    "scipy>=1.7.0,<2",
    "plotext>=5.0.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "black==23.3.0",
    "flake8>=4.0",
    "scikit-learn==1.3.0",
    "sh==2.0.7",
    "cloudpickle==2.2.1",
]

[project.scripts]
lifejacket = "lifejacket.post_deployment_analysis:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["lifejacket*"]
exclude = ["tests*"]
