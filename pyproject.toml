[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifejacket"
version = "2.0.0"
description = "Consistent standard errors for longitudinal data collected under pooling online decision policies."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Nowell Closser", email = "nowellclosser@gmail.com"}
]
dependencies = [
    "click>=8.0,<9",
    "jax>=0.4.0,<0.5",
    "jaxlib>=0.4.0,<0.5",
    "numpy>=1.20.0,<2",
    "pandas>=1.3.0,<3",
    "scipy>=1.7.0,<2",
    "plotext>=5.0.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.15.8",
    "pre-commit>=3.7",
    "scikit-learn==1.3.0",
    "cloudpickle==2.2.1",
]

[project.scripts]
lifejacket = "lifejacket.post_deployment_analysis:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["lifejacket*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
# Tests import both `tests.*` (needs the repo root on sys.path) and
# `simulators_and_runners.*` (needs tests/ on sys.path, which pytest's
# prepend import mode already provides). The root entry makes bare
# `pytest` work like CI's `python -m pytest`.
pythonpath = ["."]
markers = [
    "slow: exercises a larger fixture; excludable with -m \"not slow\"",
]

[tool.ruff]
src = ["lifejacket", "tests"]
extend-exclude = ["*.ipynb"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are imported into each test module purely to make them
# discoverable/injectable as same-named test-function parameters -- the
# import itself has no other use, which ruff can't tell apart from a genuine
# unused-import/redefinition.
"tests/integration_tests/**/*.py" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["lifejacket"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
