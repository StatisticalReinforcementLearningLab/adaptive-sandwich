[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifejacket"
version = "1.3.0"
description = "Consistent standard errors for longitudinal data collected under pooling online decision policies."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
    {name = "Nowell Closser", email = "nowellclosser@gmail.com"}
]
dependencies = [
    "click==8.1.3",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "numpy==1.25.0",
    "pandas==2.0.2",
    "scipy==1.10.1",
    "plotext==5.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "black==23.3.0",
    "flake8>=4.0",
    "scikit-learn==1.3.0",
    "sh==2.0.7",
    "cloudpickle==2.2.1",
]

[project.scripts]
lifejacket = "lifejacket.post_deployment_analysis:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["lifejacket*"]
exclude = ["tests*"]
